        aggregate_version: { type: integer, format: int64, minimum: 1 }
        correlation_id: { type: [string, "null"], description: 链条第一个事件的 event_id，一条命令及其全部下游共享 }
        causation_id: { type: [string, "null"], description: 直接触发本事件的那个事件的 event_id }
        principal_id: { type: [string, "null"] }
        payload:
          allOf: [{ $ref: '#/components/schemas/JsonMap' }]
          description: '必含 `schema: 1`；入库前已过强制脱敏'
        created_at: { $ref: '#/components/schemas/Timestamp' }
    # ── WS 帧（契约③ §5 / 事件契约 §2）───────────────────────────────────────
    WsClientHello:
      type: object
      description: 'F-16：客户端→服务端的第一个控制帧。不带 from_seq 表示只要此后新事件。'
      required: [type]
      properties:
        type: { type: string, enum: [hello] }
        from_seq: { type: [integer, "null"], format: int64 }
    WsHello:
      type: object
      required: [type, from_seq]
      properties:
        type: { type: string, enum: [hello] }
        from_seq: { type: integer, format: int64 }
    WsEventFrame:
      type: object
      required: [type, data]
      properties:
        type: { type: string, enum: [event] }
        data: { $ref: '#/components/schemas/EventJournalEntry' }
    WsResyncRequired:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [resync_required] }
        reason: { type: [string, "null"], description: journal 已裁剪到无法从 from_seq 补发 }
    WsHelloAck:
      type: object
      description: 不带 from_seq 时的首帧
      required: [type, server_seq]
      properties:
        type: { type: string, enum: [hello_ack] }
        server_seq:
          allOf: [{ type: integer, format: int64 }]
          description: 连接建立时 journal 的头游标 —— 客户端据此把游标抬到"此后"
    WsPing:
      type: object
      description: 故意不带 event_id
      required: [type, server_seq]
      properties:
        type: { type: string, enum: [ping] }
        server_seq: { type: integer, format: int64 }
    WsFrame:
      description: 服务端下发的任一帧
      oneOf:
        - { $ref: '#/components/schemas/WsHello' }
        - { $ref: '#/components/schemas/WsEventFrame' }
        - { $ref: '#/components/schemas/WsResyncRequired' }
        - { $ref: '#/components/schemas/WsHelloAck' }
        - { $ref: '#/components/schemas/WsPing' }
