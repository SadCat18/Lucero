      required: [seq, event_id, event_type, aggregate_type, aggregate_id, aggregate_version, created_at]
      properties:
        seq:
          type: integer
          format: int64
          description: 本机严格顺序 —— 客户端游标用它
        event_id: { type: string, description: UUIDv7，全局唯一 }
        event_type: { $ref: '#/components/schemas/EventType' }
        aggregate_type: { type: string, description: 单数域名单数名，与 event_type 前缀一致 }
